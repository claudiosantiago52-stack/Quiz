# =====================================================================
#  CONFIGURAÇÃO DO PLAYER DE VÍDEOS POR BOTÕES
#  Depois de alterar este arquivo, reinicie o serviço:
#      sudo systemctl restart video-botoes
# =====================================================================

[botoes]
# Número GPIO (numeração "BCM") de cada botão.
# ATENÇÃO: não é o número físico do pino (1 a 40). Veja a tabela no LEIAME.md.
# Se não souber, rode:  python3 encontrar_pinos.py
botao1 = 17
botao2 = 27
botao3 = 22

# Como o botão foi ligado:
#   true  = um fio no pino GPIO e o outro no GND (o mais comum)
#   false = um fio no pino GPIO e o outro no 3.3V
ligado_ao_gnd = true

[videos]
# Pasta onde ficam os vídeos (~ = pasta do usuário, ex.: /home/pi)
pasta = ~/videos

# Vídeo disparado por cada botão (nome do arquivo dentro da pasta acima)
video1 = video1.mp4
video2 = video2.mp4
video3 = video3.mp4

[audio]
# Saída de som:
#   p2   = saída de fone 3,5 mm da placa
#   hdmi = som pela TV/monitor
#   nenhum = sem som
saida = p2
# Volume do player, de 0 a 100
volume = 100
